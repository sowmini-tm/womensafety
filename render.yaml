# Render Blueprint for the Smart Women Security Application.
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
# All secrets use sync:false (entered manually in the dashboard, never stored here).
services:
  # ------------------------------------------------------------------ backend
  - type: web
    name: women-safety-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # start.sh applies Alembic migrations (upgrade head), then launches
    # gunicorn with uvicorn workers bound to 0.0.0.0:$PORT (Render-injected).
    startCommand: bash start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true # random >=32 chars generated by Render
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false # exact deployed frontend origin(s), comma-separated
      - key: DEV_OTP_MODE
        value: "false"
      - key: ENABLE_RATE_LIMITING
        value: "true" # REQUIRED: production startup guard in app/config.py refuses to boot without it
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: OSRM_BASE_URL
        sync: false # defaults to the public OSRM demo; point at a self-hosted OSRM for production
      - key: WEB_CONCURRENCY
        value: "2"

  # ----------------------------------------------------------------- frontend
  - type: web
    name: women-safety-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # e.g. https://women-safety-backend.onrender.com/api (baked in at build time)
    routes:
      # SPA fallback so react-router deep links resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
